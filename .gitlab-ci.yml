stages:
  - Build
  - Static Analysis
  - Test

build:conda:
  image: continuumio/miniconda
  stage: Build
  tags:
    - docker
  script:
    - python --version
    - conda env create chow
    - conda init bash
    - source ~/.bashrc
    - conda activate chow


test:pytest:
  stage: Test
  image: python:3.9
  script:
    - echo "pytest code"
    - python -m pytest
