# pyproject.toml

[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chowclassifier"
version = "2.0.0"
description = "Classification of time trends using Chow test"
readme = "README.md"
authors = [{ name = "Luc Miaz", email = "luc@miaz.ch" }]
license = "CC-BY-NC-4.0"
classifiers = [
    "Programming Language :: Python",
    "Natural Language :: English",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
]

keywords = ["chow","time-trends","bayesian","censored-data","breakpoint"]
dependencies = [
    "matplotlib >= 3.5.0",
    "numpy >=1.19.4",
    "pandas >= 1.1.5",
    "openpyxl",
    "scipy >= 1.1.5",
    "seaborn >= 0.11.2",
    "statsmodels >= 0.13.1",
    "tqdm >= 4.65.0"
]
requires-python = ">=3.9"

[tool.setuptools]
packages = ["chowclassifier"]

[tool.pytest.ini_options]
pythonpath = [
  "chowclassifier"
]

[project.optional-dependencies]
dev = ["pytest"]
# Bayesian classification with censored data (chowclassifier.bayes); not needed for the Chow test
bayes = ["pymc >= 5.10", "arviz"]
nutpie = ["pymc >= 5.10", "arviz", "nutpie"]
jax = ["pymc >= 5.10", "arviz", "numpyro", "jax"]

[project.urls]
Homepage = "https://github.com/LucMiaz/chowclassifier"
Documentation = "https://chowclassifier.readthedocs.io/en/latest/"
Source = "https://github.com/LucMiaz/chowclassifier"
Issues = "https://github.com/LucMiaz/chowclassifier/issues"

[project.scripts]
chowclassifier = "chowclassifier.__main__:main"