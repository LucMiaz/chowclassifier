# pyproject.toml

[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chowclassifier"
version = "1.0.0"
description = "Classification of time trends using Chow test"
readme = "README.md"
authors = [{ name = "Luc Miaz", email = "luc@miaz.ch" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU LESSER GENERAL PUBLIC LICENSE",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]

keywords = ["chow","time-trends"]
dependencies = [
    "matplotlib >= 3.3.3",
    "numpy >=1.19.4",
    "pandas >= 1.1.5",
    "openpyxl",
    "scipy >= 1.1.5",
    "seaborn >= 0.11.2",
    "statsmodels >= 0.12.1"
]
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = ""

[project.scripts]
chowclassifier = "chowclassifier.__main__:main"